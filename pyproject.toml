[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "survey-qgis"
version = "0.1.0"
description = "QGIS distribution layer for the survey suite: Processing provider exposing survey-cogo, survey-imagery, survey-change, and survey-raster engines as QGIS algorithms, plus a headless CLI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "crieck2010" }]
keywords = ["surveying", "remote-sensing", "QGIS", "processing", "GIS", "change-detection", "cogo"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = []

[project.optional-dependencies]
dev = ["build", "twine"]

[project.scripts]
survey-qgis = "survey_qgis.cli:main"

[project.urls]
Homepage = "https://github.com/crieck2010/survey-qgis"
Repository = "https://github.com/crieck2010/survey-qgis"
Issues = "https://github.com/crieck2010/survey-qgis/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
survey_qgis = ["metadata.txt"]
